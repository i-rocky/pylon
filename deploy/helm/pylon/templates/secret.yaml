{{- if not .Values.existingSecret }}
{{- range $i, $app := .Values.apps }}
{{- if or (not $app.secret) (eq (toString $app.secret) "CHANGE_ME") }}
{{- fail (printf "apps[%d].secret is empty or the placeholder CHANGE_ME: set a real secret (openssl rand -hex 32) or point existingSecret at a Secret you manage" $i) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pylon.fullname" . }}-apps
  labels:
    {{- include "pylon.labels" . | nindent 4 }}
type: Opaque
stringData:
  apps.json: |
    {{ .Values.apps | toJson | nindent 4 }}
  redisUrl: {{ .Values.config.redisUrl | quote }}
{{- end }}
