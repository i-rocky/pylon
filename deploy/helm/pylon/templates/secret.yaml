{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pylon.fullname" . }}-apps
  labels:
    {{- include "pylon.labels" . | nindent 4 }}
type: Opaque
stringData:
  apps.json: |
    {{ .Values.apps | toJson | nindent 4 }}
  redisUrl: {{ .Values.config.redisUrl | quote }}
{{- end }}
