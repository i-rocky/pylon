{{- if and (ne .Values.config.adapter "redis") (or (gt (int .Values.replicaCount) 1) .Values.autoscaling.enabled) }}
{{- fail (printf "replicaCount=%v autoscaling.enabled=%v need config.adapter=redis: pods on the local adapter cannot see each other's channels" .Values.replicaCount .Values.autoscaling.enabled) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pylon.fullname" . }}
  labels:
    {{- include "pylon.labels" . | nindent 4 }}
spec:
  replicas: {{ include "pylon.plainNumber" .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pylon.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Replace one pod at a time; keep the rest serving traffic.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "pylon.selectorLabels" . | nindent 8 }}
    spec:
      {{- $predrainMs := .Values.config.shutdownPredrainsMs | int64 }}
      {{- $graceMs := .Values.config.shutdownGraceMs | int64 }}
      {{- $sumMs := add $predrainMs $graceMs }}
      {{- $minSeconds := add (div $sumMs 1000) 1 }}
      {{- $overrideRaw := .Values.config.terminationGracePeriodSeconds }}
      {{- $overrideStr := toString $overrideRaw }}
      {{- if not (regexMatch "^[0-9]+$" $overrideStr) }}
      {{- fail (printf "config.terminationGracePeriodSeconds=%q is not a usable value: it must be a non-negative integer (0 means \"derive from shutdownPredrainsMs + shutdownGraceMs\")" $overrideStr) }}
      {{- end }}
      {{- $override := int $overrideRaw }}
      {{- if gt $override 0 }}
      {{- if lt $override $minSeconds }}
      {{- fail (printf "config.terminationGracePeriodSeconds=%d is too small: config.shutdownPredrainsMs (%dms) + config.shutdownGraceMs (%dms) = %dms needs terminationGracePeriodSeconds >= %ds, or SIGKILL truncates the drain" $override $predrainMs $graceMs $sumMs $minSeconds) }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $override }}
      {{- else }}
      terminationGracePeriodSeconds: {{ max (add $minSeconds 5) 30 }}
      {{- end }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: pylon
          {{- $tag := .Values.image.tag | default .Chart.AppVersion }}
          image: "{{ .Values.image.repository }}:{{ include "pylon.plainNumber" $tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: ws
              containerPort: 7000
              protocol: TCP

          env:
            - name: PYLON_BIND
              value: "0.0.0.0"
            - name: PYLON_PORT
              value: "7000"
            - name: PYLON_ADAPTER
              value: {{ .Values.config.adapter | quote }}
            {{- if or .Values.config.redisUrl .Values.existingSecret }}
            - name: PYLON_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pylon.secretName" . }}
                  key: redisUrl
            {{- end }}
            {{- if .Values.config.redisPrefix }}
            - name: PYLON_REDIS_PREFIX
              value: {{ include "pylon.plainNumber" .Values.config.redisPrefix | quote }}
            {{- end }}
            - name: PYLON_WORKERS
              value: {{ include "pylon.plainNumber" .Values.config.workers | quote }}
            - name: PYLON_APPS_PATH
              value: "/etc/pylon/apps.json"
            - name: PYLON_SHUTDOWN_PREDRAIN_MS
              value: {{ include "pylon.plainNumber" .Values.config.shutdownPredrainsMs | quote }}
            - name: PYLON_SHUTDOWN_GRACE_MS
              value: {{ include "pylon.plainNumber" .Values.config.shutdownGraceMs | quote }}
            {{- if .Values.config.memoryBudgetBytes }}
            - name: PYLON_MEMORY_BUDGET_BYTES
              value: {{ include "pylon.plainNumber" .Values.config.memoryBudgetBytes | quote }}
            {{- end }}

          volumeMounts:
            - name: apps-config
              mountPath: /etc/pylon
              readOnly: true

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          # lifecycle.preStop: optional extra pre-drain buffer if your ingress
          # is slow to deregister pods from the LB.  Leave commented unless needed.
          # lifecycle:
          #   preStop:
          #     exec:
          #       command: ["/bin/sh", "-c", "sleep 2"]

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

      volumes:
        - name: apps-config
          secret:
            secretName: {{ include "pylon.secretName" . }}
            items:
              - key: apps.json
                path: apps.json
