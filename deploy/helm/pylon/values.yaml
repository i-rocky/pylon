# values.yaml — default configuration for the pylon Helm chart.
# Override with: helm install pylon ./deploy/helm/pylon -f my-values.yaml

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/i-rocky/pylon
  # Empty defaults to the chart's own Chart.yaml appVersion, so a given chart
  # revision deploys a known, reproducible image. Set to "latest" (or any tag)
  # to opt out of that pin explicitly. Quote a purely numeric tag (e.g. "20240115")
  # so YAML keeps it as the literal text you wrote.
  tag: ""
  pullPolicy: IfNotPresent

# ── Replicas ─────────────────────────────────────────────────────────────────
replicaCount: 1

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 7000

# ── Pylon configuration ───────────────────────────────────────────────────────
config:
  # "local" for single-node; "redis" for multi-replica cluster mode.
  adapter: local

  # Required when adapter=redis.
  redisUrl: ""
  redisPrefix: "pylon"

  # 0 = auto (one worker per logical CPU).
  workers: 0

  # Memory cap in bytes. 0 = auto-derived from total RAM
  # (budget = RAM − reserve, where reserve = max(1.5 GiB, 7% of RAM),
  # capped at 50% of RAM so small-memory pods still keep a real,
  # non-zero budget instead of the reserve consuming the whole limit).
  memoryBudgetBytes: 0

  # Graceful shutdown timing (must sum to less than terminationGracePeriodSeconds).
  # Pre-drain: wait after SIGTERM before closing connections (LB drain window).
  shutdownPredrainsMs: 2000
  # Grace: max time to flush in-flight connections.
  shutdownGraceMs: 10000

# ── Apps configuration (apps.json) ──────────────────────────────────────────
# The apps list is rendered into a Kubernetes Secret (never a ConfigMap) and
# mounted at /etc/pylon/apps.json. `config.redisUrl` goes into the same Secret
# and reaches the container through a secretKeyRef, so a URL carrying
# credentials is never a literal env value in the pod spec.
#
# Set `existingSecret` to the name of a Secret you manage yourself (from an
# external secret manager, sealed-secrets, or anything else) and the chart
# creates none. It must carry the keys `apps.json` and `redisUrl`.
existingSecret: ""
apps:
  - name: my-app
    id: app
    key: app-key
    secret: "CHANGE_ME"
    capacity: 1000000
    client_messages_enabled: false
    enabled: true
    webhooks: []

# ── Resources ─────────────────────────────────────────────────────────────────
# Tune for your workload. These are conservative starting points.
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "4000m"
    memory: "8Gi"

# ── Security context ─────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534    # nobody
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Probes ───────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: 7000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 7000
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 2

# ── Autoscaling ───────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

# ── Disruption budget ────────────────────────────────────────────────────────
# Keeps at least one pylon pod serving through a voluntary disruption (node
# drain, cluster autoscaler scale-down). The Deployment's maxUnavailable: 0
# only covers rolling updates; this covers evictions.
# Rendered only when replicaCount is above 1 or autoscaling is enabled: a
# budget over a single pod would block every voluntary eviction.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Node tuning NOTE ─────────────────────────────────────────────────────────
# Kubernetes cannot fully set per-pod sysctl values for most network settings.
# The following MUST be applied at the node level before deploying pylon:
#
#   1. Apply deploy/systemd/99-pylon.sysctl.conf to every node:
#        sysctl -w net.core.somaxconn=65535
#        sysctl -w fs.file-max=12000500
#        ... (see 99-pylon.sysctl.conf for the full list)
#
#   2. Ensure the container runtime sets nofile ≥ 2 000 000 per container.
#      For containerd, set in /etc/containerd/config.toml or via the node's
#      /etc/security/limits.conf. For docker-shim, set default-ulimits in
#      /etc/docker/daemon.json.
#
#   3. If your nodes support it, you may use a DaemonSet + privileged initContainer
#      to apply sysctls at runtime, or configure the kubelet's
#      --allowed-unsafe-sysctls flag for net.* settings.
#
# Some "safe" sysctls (net.ipv4.tcp_rmem etc.) can be set via pod spec
# securityContext.sysctls if allowed by the cluster admin.
