# docker-compose.test.yml — the four services `cargo test`'s full suite needs,
# on the documented safe ports for local test runs (see CONTRIBUTING.md and
# the dev guide's Testing section). Mirrors the service containers in
# .github/workflows/ci.yml. Not for production use — no persistence, no auth
# hardening.
#
# Usage:
#   docker compose -f deploy/docker/docker-compose.test.yml up -d
#   export PYLON_TEST_REDIS_URL=redis://127.0.0.1:6390
#   export PYLON_TEST_MYSQL_URL=mysql://root:pylon@127.0.0.1:3307/pylon_test
#   export PYLON_TEST_POSTGRES_URL=postgres://postgres:pylon@127.0.0.1:5433/pylon_test
#   export PYLON_TEST_MONGO_URL=mongodb://127.0.0.1:27018/pylon_test
#   cargo test --locked --no-fail-fast -- --test-threads=1
#   docker compose -f deploy/docker/docker-compose.test.yml down -v

services:

  redis:
    image: redis:7
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: pylon
      MYSQL_DATABASE: pylon_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -ppylon"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pylon
      POSTGRES_DB: pylon_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pylon_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 3s
      retries: 5
