name: conformance

# Runs the SDK conformance crate against a freshly built pylon.
# Opt-in (workflow_dispatch); uncomment the schedule block to run nightly.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "18" }
      - name: Install adapter deps
        run: |
          cd conformance/adapters/pusher-js && npm ci
          cd ../pusher-http-node && npm ci
      - name: Build pylon (release)
        run: cargo build --release --locked
      - name: Run conformance suite
        run: cd conformance && cargo run --release -- --report conformance-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: conformance-report, path: conformance/conformance-report.json }
