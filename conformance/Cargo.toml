[package]
name = "pylon-conformance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util"] }
axum = "0.8"

# Standalone harness crate: explicitly NOT a member of the root pylon workspace
# (the root manifest's `[workspace]` would otherwise claim this directory).
[workspace]
